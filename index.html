<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Refri Dev</title>
</head>
<body>
    <main>
        <div class="item active" style="--background: #ea3d41">
            <div class="title">Morango</div>
            <img class="fruit" src="./images/Morango-refrigerante-foregroundBlur.png" alt="">
            <img class="refri" src="./images/Morango-refrigerante.png" alt="">
        </div>

        <div class="item" style="--background: #2d5643">
            <div class="title">Abacate</div>
            <img class="fruit" src="./images/Abacate-refrigerante-foregroundBlur.png" alt="">
            <img class="refri" src="./images/Abacate-refrigerante.png" alt="">
        </div>

        <div class="item hidden" style="--background: #e7a043">
            <div class="title">Laranja</div>
            <img class="fruit" src="./images/Laranja-refrigerante-foregroundBlur.png" alt="">
            <img class="refri" src="./images/Laranja-refrigerante.png" alt="">
        </div>

        <div class="arrows">
            <button id="prev"><</button>
            <button id="next">></button>
        </div>
    </main>
    <script src="./scripts.js"></script>
</body>
</html>
